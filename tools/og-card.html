<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
html{background:#fff}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#fff;color:#42566B;
 font-family:Inter,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;
 padding:0 84px;box-sizing:border-box;position:relative}
.grid{position:absolute;inset:0;
 background-image:linear-gradient(#E3E9F1 1px,transparent 1px),linear-gradient(90deg,#E3E9F1 1px,transparent 1px);
 background-size:64px 64px;
 -webkit-mask-image:radial-gradient(75% 70% at 50% 0%,#000 0%,transparent 78%)}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,#EFF4FE 0%,rgba(239,244,254,0) 60%)}
.row{display:flex;align-items:center;gap:16px;position:relative}
.row img{width:60px;height:60px}
.name{font-family:Fraunces,Georgia,serif;font-size:32px;font-weight:600;color:#0C1A2B}
.amp{color:#1D4ED8;font-style:italic}
h1{font-family:Fraunces,Georgia,serif;font-size:68px;font-weight:600;line-height:1.09;
 letter-spacing:-.025em;margin:38px 0 0;position:relative;max-width:1000px;color:#0C1A2B}
h1 em{font-style:italic;color:#1D4ED8}
p{font-size:22px;color:#42566B;margin:24px 0 0;max-width:900px;position:relative}
.chips{display:flex;gap:10px;margin-top:36px;position:relative}
.chips span{font-size:16px;color:#71849A;background:#fff;border:1px solid #E3E9F1;
 border-radius:999px;padding:9px 18px}
</style>
<div class="tint"></div><div class="grid"></div>
<div class="row"><img src="../assets/img/logo-mark-solid.svg"><span class="name">Frazier <span class="amp">&amp;</span> Co.</span></div>
<h1>Nine figures of media, <em>deployed with intent.</em></h1>
<p>Brand campaign management, lead generation and the growth systems underneath — 10+ years, hundreds of millions in business generated.</p>
<div class="chips"><span>Campaign management</span><span>Lead generation</span><span>Systems integration</span><span>Ad platform monetization</span></div>
